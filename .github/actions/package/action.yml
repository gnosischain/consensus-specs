name: Package tests
description: >-
  Download intermediate test artifacts, archive them into a tarball, and delete
  the intermediates. The caller is responsible for uploading the tarball.

inputs:
  name:
    description: Tarball name (without .tar.gz).
    required: true
  artifact-name:
    description: >-
      Name used to filter the intermediate artifacts (`<artifact-prefix>-<artifact-name>-*`).
      Defaults to `name`. Set this when the published tarball name differs from the name the
      intermediate artifacts were generated under (e.g. Gnosis tests generated as `mainnet`
      but published as `gnosis`).
    required: false
    default: ""
  artifact-prefix:
    description: Prefix for intermediate artifact names.
    required: true
  source-path:
    description: Directory to download artifacts into and to include in the tarball.
    required: true
  github-token:
    description: Token used to delete intermediate artifacts.
    required: true

runs:
  using: composite
  steps:
    - name: Download intermediate artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: ${{ inputs.artifact-prefix }}-${{ inputs.artifact-name != '' && inputs.artifact-name || inputs.name }}-*
        path: ${{ inputs.source-path }}
        merge-multiple: true

    - name: Prune vacuous (manifest-only) test cases
      shell: bash
      run: |
        # Some test cases are not reachable under a given preset (e.g. consolidation-churn
        # "incorrect_*" cases under the Gnosis preset), so pyspec emits a manifest.yaml with no
        # pre/post/operation data. Client ef-test runners crash trying to load the missing files,
        # so drop these empty case directories before packaging.
        pruned=0
        while IFS= read -r m; do
          d=$(dirname "$m")
          if [ "$(find "$d" -maxdepth 1 -type f | wc -l)" -le 1 ]; then
            rm -rf "$d"; pruned=$((pruned+1))
          fi
        done < <(find ${{ inputs.source-path }} -name manifest.yaml 2>/dev/null)
        echo "Pruned ${pruned} vacuous (manifest-only) case directories."

    - name: Archive tests
      shell: bash
      run: |
        # Ensure source-path exists so tar succeeds even when zero artifacts
        # were downloaded (e.g. presets with no per-fork reftests).
        mkdir -p ${{ inputs.source-path }}
        tar --sort=name \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --mtime='@0' \
            --format=gnu \
            --use-compress-program='gzip --no-name' \
            --create \
            --file=${{ inputs.name }}.tar.gz \
            ${{ inputs.source-path }}

    - name: Delete intermediate artifacts
      shell: bash
      run: |
        gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
          --paginate --jq '.artifacts[]
            | select(.name | startswith("${{ inputs.artifact-prefix }}-${{ inputs.artifact-name != '' && inputs.artifact-name || inputs.name }}-"))
            | .id' | while read id; do
          gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id
        done
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
