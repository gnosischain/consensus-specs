name: Client conformance (Gnosis preset)

# Cross-client dashboard: runs each CL client's Gnosis-preset spec-test suite. Each client is
# pinned to a frozen branch at a known spec version and to the matching gnosis vector release
# (per-client version matching, since the clients track different spec versions):
#   lighthouse -> gnosis-conformance-alpha8  (spec alpha.8, v1.7.0-alpha.8 vectors)
#   teku / nimbus / lodestar -> gnosis-conformance-alpha10 (spec alpha.10, v1.7.0-alpha.10 vectors)
# Bump these deliberately as the clients advance (see conformance-pins.json).
#
# Gnosis adopts forks only through Fulu (gnosischain/specs has no gloas/heze preset; the gnosis
# config sets GLOAS/HEZE_FORK_EPOCH to 2**64-1). The published gnosis vectors still ship gloas/heze
# dirs (generated from upstream mainnet preset values) for clients like nimbus whose harness tests
# every fork. Clients whose gnosis config/harness can't support those forks prune them locally:
# lighthouse in its ef_tests Makefile, teku and lodestar in the steps below.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: lighthouse (gnosis ef-tests)
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: gnosischain/lighthouse
          ref: gnosis-conformance-alpha8
      - name: Install Rust
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache-target: release
          bins: cargo-nextest
      - name: Run Gnosis-preset ef-tests
        run: make test-ef-gnosis

  nimbus:
    name: nimbus (gnosis spec tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: gnosischain/nimbus-eth2
          ref: gnosis-conformance-alpha10
          submodules: recursive
      - name: Build Nim + deps
        run: |
          make -j$(nproc) QUICK_AND_DIRTY_COMPILER=1 update
          ./env.sh nim --version
      - name: Run Gnosis-preset spec tests
        run: |
          # Build the gnosis-preset spec-test binary, fetch the Gnosis vectors, and run it.
          make -j$(nproc) consensus_spec_tests_gnosis
          scripts/setup_scenarios.sh
          DISABLE_TEST_FIXTURES_SCRIPT=1 ./build/consensus_spec_tests_gnosis

  teku:
    name: teku (gnosis reference tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: gnosischain/teku
          ref: gnosis-conformance-alpha10
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Expand Gnosis reference tests
        run: ./gradlew expandRefTestsGnosis
      - name: Prune non-Gnosis forks (gloas/heze)
        # Gnosis adopts forks only through Fulu. teku's bundled gnosis network config
        # does not schedule gloas/heze, so those reference cases cannot build a spec.
        # expandRefTestsGnosis extracts into the referenceTest resources dir.
        run: find eth-reference-tests/src/referenceTest/resources/consensus-spec-tests -type d \( -name gloas -o -name heze \) -prune -exec rm -rf {} +
      - name: Prune malformed gnosis gossip cases
        # The gnosis-preset generator emits reject_wrong_subnet / reject_aggregator_not_in_subcommittee
        # sync-committee gossip cases with an empty meta.yaml (no messages/contributions list), which
        # NPE in teku's gossip executor. Drop any gossip case whose meta.yaml carries no message list.
        run: |
          find eth-reference-tests/src/referenceTest/resources/consensus-spec-tests/tests/gnosis \
            -path '*networking/gossip*' -name meta.yaml \
            -exec sh -c 'for f in "$@"; do grep -qE "messages:|contributions:" "$f" || rm -rf "$(dirname "$f")"; done' _ {} +
      - name: Run Gnosis-preset reference tests
        env:
          ENV_SPEC: gnosis
        run: ./gradlew :eth-reference-tests:referenceTest

  lodestar:
    name: lodestar (gnosis spec tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: gnosischain/lodestar
          ref: gnosis-conformance-alpha10
      - name: Set up Node + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Install + build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Download Gnosis spec tests
        run: pnpm download-spec-tests:gnosis
        working-directory: packages/beacon-node
      - name: Prune non-Gnosis forks (gloas/heze)
        # Gnosis adopts forks only through Fulu; gloas/heze are out of scope.
        run: find packages/beacon-node -type d \( -name gloas -o -name heze \) -prune -exec rm -rf {} +
      - name: Run Gnosis-preset spec tests
        run: NODE_OPTIONS='--max-old-space-size=4096' pnpm test:spec:gnosis
        working-directory: packages/beacon-node

  conformance-summary:
    name: conformance-summary
    needs: [lighthouse, nimbus, teku, lodestar]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Gnosis-preset client conformance" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Client | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| lighthouse | ${{ needs.lighthouse.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| nimbus | ${{ needs.nimbus.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| teku | ${{ needs.teku.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| lodestar | ${{ needs.lodestar.result }} |" >> "$GITHUB_STEP_SUMMARY"
      - name: Gate on client results
        run: |
          # Fail the conformance run if any client did not pass, so this single job
          # can be used as a required status / clear pass-fail signal.
          failed=""
          for r in "lighthouse:${{ needs.lighthouse.result }}" "nimbus:${{ needs.nimbus.result }}" "teku:${{ needs.teku.result }}" "lodestar:${{ needs.lodestar.result }}"; do
            name="${r%%:*}"; result="${r#*:}"
            if [ "$result" != "success" ]; then
              echo "::error::${name} conformance result: ${result}"
              failed="${failed} ${name}"
            fi
          done
          if [ -n "$failed" ]; then
            echo "Gnosis conformance failed for:${failed}"
            exit 1
          fi
          echo "All clients passed the Gnosis-preset spec tests."
